# Canonical Road Beyond Roles daily workflow configuration.
name: Daily jobs video
on:
  schedule:
    - cron: "30 2 * * *"      # 02:30 UTC = 08:00 IST (GitHub may delay by a few minutes)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Run pipeline
        run: |
          ARGS=""
          if [ -n "$YT_TOKEN_JSON" ]; then ARGS="--upload --privacy private"; fi
          python run_daily.py --push $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: build/*/video.mp4
          retention-days: 3
